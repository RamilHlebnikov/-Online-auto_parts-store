<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <!-- Для iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- Для Android -->
    <meta name="theme-color" content="#0F2438" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0F2438" media="(prefers-color-scheme: dark)">

    <title>Интернет-магазин автозапчастей</title>

    <!-- Favicon -->
    <!-- <link rel="icon" type="image/png" href="./images/icons/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="./images/icons/favicon.svg" />
    <link rel="shortcut icon" href="./images/icons/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="./images/icons/apple-touch-icon.png" />
    <link rel="manifest" href="./images/icons/site.webmanifest" /> -->

    <!-- Для иконок с сайта Boxicons -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

    <!-- Подключенные файлы CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/media.css">
</head>
<body>
    <!-- Служебная понель (Top Bar) -->
    <div class="top__bar">
        <div class="container">

            <!-- Левая часть -->
            <div class="top__bar--left">
                
                <!-- Кнопка города -->
                <button class="city__selector" type="button">
                    <svg class="icon__location" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M10 0C6.12297 0 2.96875 3.15422 2.96875 7.03125C2.96875 8.34117 3.3316 9.61953 4.01832 10.7286L9.59977 19.723C9.70668 19.8953 9.89504 20 10.0976 20C10.0992 20 10.1007 20 10.1023 20C10.3066 19.9984 10.4954 19.8905 10.6003 19.7152L16.0395 10.6336C16.6883 9.54797 17.0312 8.30231 17.0312 7.03125C17.0312 3.15422 13.877 0 10 0ZM15.0338 10.032L10.0887 18.2885L5.01434 10.1112C4.44273 9.18805 4.13281 8.12305 4.13281 7.03125C4.13281 3.80039 6.76914 1.16406 10 1.16406C13.2309 1.16406 15.8633 3.80039 15.8633 7.03125C15.8633 8.09066 15.5738 9.12844 15.0338 10.032Z" fill="white"/>
                        <path d="M10 3.51562C8.06148 3.51562 6.48438 5.09273 6.48438 7.03125C6.48438 8.95738 8.03582 10.5469 10 10.5469C11.9884 10.5469 13.5156 8.93621 13.5156 7.03125C13.5156 5.09273 11.9385 3.51562 10 3.51562ZM10 9.38281C8.7009 9.38281 7.64844 8.32684 7.64844 7.03125C7.64844 5.73891 8.70766 4.67969 10 4.67969C11.2923 4.67969 12.3477 5.73891 12.3477 7.03125C12.3477 8.30793 11.3197 9.38281 10 9.38281Z" fill="white"/>
                    </svg>
                    <span>Ваш город: <span class="city__name">не выбран</span></span>
                </button>

                <!-- Две ссылки (Информация, Сотрудничество) -->
                <nav class="top__bar--nav">
                    <a href="#" class="top__bar-nav--link">
                        Информация
                        <svg class="top__bar-nav--icon" width="10" height="10" viewBox="0 0 10 10" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <g clip-path="url(#clip0_1_457)">
                                <path d="M5.35692 7.60686L9.85238 3.1099C10.0492 2.91258 10.0492 2.59288 9.85238 2.39506C9.65556 2.19774 9.33586 2.19774 9.13904 2.39506L5.00027 6.53532L0.861506 2.39556C0.664681 2.19824 0.344986 2.19824 0.147663 2.39556C-0.0491624 2.59288 -0.0491625 2.91308 0.147663 3.1104L4.64312 7.60736C4.83791 7.80169 5.16263 7.80169 5.35692 7.60686Z" fill="white"/>
                            </g>
                            <defs>
                                <clipPath id="clip0_1_457">
                                    <rect width="10" height="10" fill="white" transform="translate(10) rotate(90)"/>
                                </clipPath>
                            </defs>
                        </svg>
                    </a>
                    
                    <a href="#" class="top__bar-nav--link">
                        Сотрудничество
                        <svg class="top__bar-nav--icon" width="10" height="10" viewBox="0 0 10 10" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <g clip-path="url(#clip0_1_457)">
                                <path d="M5.35692 7.60686L9.85238 3.1099C10.0492 2.91258 10.0492 2.59288 9.85238 2.39506C9.65556 2.19774 9.33586 2.19774 9.13904 2.39506L5.00027 6.53532L0.861506 2.39556C0.664681 2.19824 0.344986 2.19824 0.147663 2.39556C-0.0491624 2.59288 -0.0491625 2.91308 0.147663 3.1104L4.64312 7.60736C4.83791 7.80169 5.16263 7.80169 5.35692 7.60686Z" fill="white"/>
                            </g>
                            <defs>
                                <clipPath id="clip0_1_457">
                                    <rect width="10" height="10" fill="white" transform="translate(10) rotate(90)"/>
                                </clipPath>
                            </defs>
                        </svg>
                    </a>
                </nav>
            </div>

            <!-- Правая часть -->
            <div class="top__bar--right">
                <ul class="top__bar--list">
                    <li class="top__bar--item">
                        <a href="delivery.html" class="top__bar--link" target="_blank">Доставка</a>
                    </li>
                    <li class="top__bar--item">
                        <a href="payment.html" class="top__bar--link" target="_blank">Оплата</a>
                    </li>
                    <li class="top__bar--item">
                        <a href="guarantee.html" class="top__bar--link" target="_blank">Гарантия</a>
                    </li>
                    <li class="top__bar--item">
                        <a href="news.html" class="top__bar--link" target="_blank">Новости</a>
                    </li>
                    <li class="top__bar--item">
                        <a href="about__store.html" class="top__bar--link top__bar--link-active" target="_blank">О магазине</a>
                    </li>
                    <li class="top__bar--item">
                        <a href="contacts.html" class="top__bar--link" target="_blank">Контакты</a>
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <!-- Модальное окно (Скрыто по умолчанию) -->
    <div class="modal__overlay" id="city-modal">
        <div class="modal__city">
            
            <div class="modal__city--header">
                <h2 class="modal__city--title">Выберите свой город</h2>
                <button class="modal__city--close" type="button" aria-label="Закрыть">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <g clip-path="url(#clip0_1_608)">
                            <path d="M1.03451 20C0.771056 20 0.507606 19.8998 0.307445 19.6982C-0.0943844 19.2963 -0.0943844 18.6449 0.307445 18.2431L18.2491 0.301372C18.651 -0.100457 19.3024 -0.100457 19.7043 0.301372C20.1061 0.703201 20.1061 1.35467 19.7043 1.75675L1.76282 19.6982C1.56115 19.8986 1.2977 20 1.03451 20V20Z" fill="#A29DBC"/>
                            <path d="M18.9774 20C18.714 20 18.4508 19.8998 18.2504 19.6982L0.307445 1.75675C-0.0943844 1.35467 -0.0943844 0.703201 0.307445 0.301372C0.709274 -0.100457 1.36074 -0.100457 1.76282 0.301372L19.7043 18.2431C20.1061 18.6449 20.1061 19.2963 19.7043 19.6982C19.5026 19.8986 19.2394 20 18.9774 20Z" fill="#A29DBC"/>
                        </g>
                        <defs>
                            <clipPath id="clip0_1_608">
                                <rect width="20" height="20" fill="white"/>
                            </clipPath>
                        </defs>
                    </svg>
                </button>
            </div>

            <div class="modal__city--search">
                <input type="text" class="modal__city--input" placeholder="Ваш город">
            </div>

            <ul class="modal__city--list">
                <li class="modal__city--item">
                    <a href="#" class="modal__city--link modal__city--link-active">Москва</a>
                </li>
                <li class="modal__city--item">
                    <a href="#" class="modal__city--link">Санкт-Петербург</a>
                </li>
                <li class="modal__city--item">
                    <a href="#" class="modal__city--link">Краснодар</a>
                </li>
                <li class="modal__city--item">
                    <a href="#" class="modal__city--link">Екатеринбург</a>
                </li>
                <li class="modal__city--item">
                    <a href="#" class="modal__city--link">Ростов-на-Дону</a>
                </li>
                <li class="modal__city--item">
                    <a href="#" class="modal__city--link">Самара</a>
                </li>
            </ul>
        </div>
    </div>

    <script src="./js/script.js"></script>
</body>
</html>
